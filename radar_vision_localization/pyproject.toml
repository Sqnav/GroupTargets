[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-vision-localization"
version = "3.0.0"
description = "Seven controlled 32 MHz co-centered radar/vision localization experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.5", "Pillow>=9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rvloc = "rvloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rvloc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
